        <meta name="robots" content="noindex, nofollow, noarchive" />

html.staticrypt-html,.staticrypt-body{height:100%;margin:0}
.staticrypt-content{min-height:100%;color:#fff;font-family:'Rubik',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;
  background:radial-gradient(80% 120% at 90% -20%,#1F8A61 0%,rgba(31,138,97,0) 55%),radial-gradient(70% 90% at -10% 120%,#0E5239 0%,rgba(14,82,57,0) 60%),linear-gradient(165deg,#0B4530 0%,#052419 100%)}
.staticrypt-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;box-sizing:border-box}
.staticrypt-form{width:100%;max-width:400px;background:#FFFDF9;color:#1F3A2E;border-radius:24px;padding:38px 32px 30px;box-sizing:border-box;box-shadow:0 40px 90px -40px rgba(0,0,0,.55);text-align:left}
.sc-brand{font-family:'Libre Baskerville',Georgia,serif;font-size:22px;color:#126344}
.sc-class{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#C2672A;margin-bottom:14px;font-weight:500}
.sc-brand small{font-family:'Rubik',sans-serif;font-weight:300;font-size:13px;color:#4F6D61;margin-left:8px}
.staticrypt-instructions p{margin:0}
.staticrypt-title{font-family:'Libre Baskerville',Georgia,serif;font-size:26px;line-height:1.2;color:#0B4530;margin-top:18px!important}
.staticrypt-instructions p+p{margin-top:10px;color:#4F6D61;font-size:15px;line-height:1.5}
.staticrypt-hr{border:0;border-top:1px solid #E6DACB;margin:22px 0}
.staticrypt-password-container{position:relative;background:#F6F2EA;border:1px solid #E3DACB;border-radius:999px;margin:0 0 14px;box-sizing:border-box}
.staticrypt-password-container:focus-within{border-color:#126344}
.staticrypt-form input[type="password"],.staticrypt-form input[type="text"]{background:transparent;border:0;outline:0;box-sizing:border-box;width:100%;padding:14px 48px 14px 20px;font:400 16px 'Rubik',sans-serif;color:#0B4530}
.staticrypt-toggle-password-visibility{cursor:pointer;height:20px;width:20px;opacity:.55;padding:12px;position:absolute;right:6px;top:50%;transform:translateY(-50%)}
label.staticrypt-remember{display:flex;align-items:center;gap:10px;margin:4px 0 18px;font-size:14px;color:#4F6D61}
.staticrypt-remember input[type="checkbox"]{accent-color:#126344;width:16px;height:16px;margin:0}
.staticrypt-form .staticrypt-decrypt-button{width:100%;border:0;border-radius:999px;padding:14px;background:#126344;color:#fff;font:500 15px 'Rubik',sans-serif;letter-spacing:.02em;cursor:pointer}
.staticrypt-form .staticrypt-decrypt-button:hover,.staticrypt-form .staticrypt-decrypt-button:focus{background:#0B4530}
.sc-foot{margin-top:18px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#4F6D61;text-align:center}
.sc-foot b{color:#126344;font-weight:500}
.sc-error{margin:12px 0 0;font-size:14px;color:#9A4A12;background:#FFE3CF;border-radius:12px;padding:10px 14px}
.hidden{display:none!important}
.staticrypt-spinner-container{height:100vh;display:flex;align-items:center;justify-content:center;background:#0B4530}
.staticrypt-spinner{display:inline-block;width:2rem;height:2rem;border:.25em solid #FFAE75;border-right-color:transparent;border-radius:50%;animation:spinner-border .75s linear infinite}
@keyframes spinner-border{100%{transform:rotate(360deg)}}
</style>
